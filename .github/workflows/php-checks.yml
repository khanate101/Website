name: PHP checks
on:
  push:
    branches: [main, "feature/**"]
  pull_request:
jobs:
  syntax:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: "8.2"
          extensions: pdo_mysql, mbstring, fileinfo
          coverage: none
      - name: Validate Composer manifest
        if: hashFiles('composer.json') != ''
        run: composer validate --no-check-publish
      - name: Install dependencies
        if: hashFiles('composer.json') != ''
        run: composer install --no-interaction --prefer-dist
      - name: Lint PHP files
        if: hashFiles('app/**/*.php', 'bin/**/*.php', 'public/**/*.php', 'tests/**/*.php') != ''
        run: find app bin public tests -type f -name "*.php" -print0 | xargs -0 -n1 php -l
      - name: Run smoke tests
        if: hashFiles('tests/smoke.php') != ''
        run: php tests/smoke.php
